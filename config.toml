# Einstellungen für medienlabor

[pfade]
daten = "/mnt/daten/dirigent"          # Zustand, Log und Stoppdatei des Dirigenten

[zeit]
bis = "17:30"                          # ab dieser Uhrzeit beginnt keine neue Aufgabe mehr
block_minuten = 90                     # so lange arbeitet eine Aufgabe, bevor die nächste drankommt

[lesesaal]
ordner = "/home/apollon/Arbeitsmappe_Lokal/Code/lesesaal"
daten = "/mnt/daten/lesesaal"

[zettelkasten]
ordner = "/home/apollon/Arbeitsmappe_Lokal/Code/zettelkasten"
daten = "/mnt/daten/zettelkasten"

[kursaufnahmen]
quelle = "/mnt/daten/bilanzbuchhalter/video"           # OBS legt die Aufnahmen hier ab, noScribe das Transkript daneben
klein = "/mnt/daten/bilanzbuchhalter/video_klein"      # Zwischenablage; nach dem Archivieren kommt die kleine Fassung nach quelle
archiv = "/mnt/archiv/bilanzbuchhalter/video"          # Originale, Prüfsummen und Kopien der Transkripte
archiv_platte = "/mnt/archiv"                          # ohne eingehängte Platte bleibt das Original liegen
kursplan = "/mnt/daten/bilanzbuchhalter/kursplan.csv"  # Datum, Fach, Dozent; daraus die Dateinamen
transkribieren_ab = "2026-11-17"                       # ältere Aufnahmen sind schon von Hand transkribiert
noscribe = "/home/apollon/opt/noScribe"
# dieselben Einstellungen wie bisher im Fenster von noScribe
noscribe_optionen = ["--language", "de", "--model", "precise", "--speaker-detection", "auto",
                     "--overlapping", "--timestamps", "--disfluencies", "--pause", "1sec+"]

[aufgaben]
# Reihenfolge im Wechsel; eine Aufgabe ohne offene Arbeit wird übersprungen
reihe = ["abschrift", "anreicherung", "aufarbeitung", "kursaufnahmen"]
